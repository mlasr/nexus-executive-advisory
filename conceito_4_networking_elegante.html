<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conceito 4 - Conexões Elegantes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1520 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scene {
            position: relative;
            width: 1000px;
            height: 900px;
        }
        
        /* Ambiente de fundo */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, 
                        rgba(212, 175, 55, 0.15) 0%,
                        rgba(47, 93, 80, 0.08) 40%,
                        transparent 70%);
            filter: blur(80px);
            animation: ambientPulse 8s ease-in-out infinite;
        }
        
        @keyframes ambientPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }
        
        /* Figura individual */
        .figure {
            position: absolute;
            transition: all 0.5s ease;
        }
        
        .figure-body {
            width: 140px;
            height: 280px;
            background: linear-gradient(180deg, 
                        rgba(212, 175, 55, 0.9) 0%,
                        rgba(212, 175, 55, 0.7) 50%,
                        rgba(140, 120, 83, 0.8) 100%);
            border-radius: 50px 50px 40px 40px;
            position: relative;
            box-shadow: 
                inset -10px 0 30px rgba(0, 0, 0, 0.2),
                0 20px 50px rgba(212, 175, 55, 0.4);
            animation: figureBreath 4s ease-in-out infinite;
        }
        
        @keyframes figureBreath {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.01); }
        }
        
        .figure-head {
            position: absolute;
            width: 80px;
            height: 100px;
            background: linear-gradient(135deg, 
                        #d4af37 0%,
                        #c4a137 50%,
                        #b8941f 100%);
            border-radius: 50% 50% 45% 45%;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.2),
                0 15px 40px rgba(212, 175, 55, 0.5);
        }
        
        /* Posicionamento das figuras */
        .figure-1 {
            top: 25%;
            left: 15%;
            animation-delay: 0s;
        }
        
        .figure-2 {
            top: 20%;
            right: 20%;
            animation-delay: 0.5s;
        }
        
        .figure-3 {
            bottom: 25%;
            left: 25%;
            animation-delay: 1s;
        }
        
        .figure-4 {
            bottom: 30%;
            right: 15%;
            animation-delay: 1.5s;
        }
        
        .figure-5 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 0.75s;
        }
        
        .figure-5 .figure-body {
            width: 160px;
            height: 320px;
            background: linear-gradient(180deg, 
                        rgba(212, 175, 55, 1) 0%,
                        rgba(212, 175, 55, 0.85) 50%,
                        rgba(140, 120, 83, 0.9) 100%);
        }
        
        .figure-5 .figure-head {
            width: 90px;
            height: 115px;
        }
        
        /* Linhas de conexão */
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, 
                        transparent,
                        rgba(212, 175, 55, 0.4),
                        transparent);
            transform-origin: left center;
            animation: connectionPulse 3s ease-in-out infinite;
        }
        
        @keyframes connectionPulse {
            0%, 100% { 
                opacity: 0.3;
                box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            }
            50% { 
                opacity: 0.7;
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            }
        }
        
        .line-1 {
            width: 280px;
            top: 32%;
            left: 21%;
            transform: rotate(5deg);
            animation-delay: 0s;
        }
        
        .line-2 {
            width: 320px;
            top: 38%;
            left: 32%;
            transform: rotate(-8deg);
            animation-delay: 0.5s;
        }
        
        .line-3 {
            width: 250px;
            bottom: 36%;
            left: 31%;
            transform: rotate(-15deg);
            animation-delay: 1s;
        }
        
        .line-4 {
            width: 290px;
            bottom: 38%;
            left: 42%;
            transform: rotate(12deg);
            animation-delay: 1.5s;
        }
        
        .line-5 {
            width: 200px;
            top: 42%;
            right: 26%;
            transform: rotate(-25deg);
            animation-delay: 0.75s;
        }
        
        .line-6 {
            width: 180px;
            bottom: 42%;
            right: 24%;
            transform: rotate(20deg);
            animation-delay: 1.25s;
        }
        
        /* Pontos de conexão */
        .connection-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #d4af37, #8c7853);
            border-radius: 50%;
            box-shadow: 
                0 0 20px rgba(212, 175, 55, 0.8),
                inset 0 2px 4px rgba(255, 255, 255, 0.3);
            animation: pointGlow 2s ease-in-out infinite;
        }
        
        @keyframes pointGlow {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            }
            50% { 
                transform: scale(1.3);
                box-shadow: 0 0 30px rgba(212, 175, 55, 1);
            }
        }
        
        .point-1 {
            top: 31%;
            left: 20%;
            animation-delay: 0s;
        }
        
        .point-2 {
            top: 29%;
            right: 25%;
            animation-delay: 0.3s;
        }
        
        .point-3 {
            bottom: 31%;
            left: 29%;
            animation-delay: 0.6s;
        }
        
        .point-4 {
            bottom: 35%;
            right: 20%;
            animation-delay: 0.9s;
        }
        
        .point-5 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 0.45s;
            width: 16px;
            height: 16px;
        }
        
        /* Círculos de energia */
        .energy-circle {
            position: absolute;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            animation: energyExpand 4s ease-out infinite;
        }
        
        @keyframes energyExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 0.8;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }
        
        .circle-1 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 0s;
        }
        
        .circle-2 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 1.3s;
        }
        
        .circle-3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 2.6s;
        }
        
        /* Partículas de interação */
        .interaction-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            animation: particleTravel 5s ease-in-out infinite;
        }
        
        @keyframes particleTravel {
            0%, 100% { 
                opacity: 0;
                transform: translate(0, 0) scale(1);
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translate(var(--travel-x, 0), var(--travel-y, 0)) scale(0.5);
            }
        }
        
        .particle-1 {
            top: 32%;
            left: 21%;
            --travel-x: 280px;
            --travel-y: 20px;
            animation-delay: 0s;
        }
        
        .particle-2 {
            top: 38%;
            left: 32%;
            --travel-x: 320px;
            --travel-y: -40px;
            animation-delay: 1s;
        }
        
        .particle-3 {
            bottom: 36%;
            left: 31%;
            --travel-x: 250px;
            --travel-y: -60px;
            animation-delay: 2s;
        }
        
        .particle-4 {
            bottom: 38%;
            left: 42%;
            --travel-x: 290px;
            --travel-y: 50px;
            animation-delay: 3s;
        }
        
        /* Texto flutuante */
        .floating-text {
            position: absolute;
            font-family: 'Georgia', serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(212, 175, 55, 0.4);
            text-transform: uppercase;
            animation: textFloat 6s ease-in-out infinite;
        }
        
        @keyframes textFloat {
            0%, 100% { 
                transform: translateY(0);
                opacity: 0.3;
            }
            50% { 
                transform: translateY(-20px);
                opacity: 0.6;
            }
        }
        
        .text-1 {
            top: 15%;
            left: 20%;
            animation-delay: 0s;
        }
        
        .text-2 {
            top: 12%;
            right: 22%;
            animation-delay: 1s;
        }
        
        .text-3 {
            bottom: 18%;
            left: 28%;
            animation-delay: 2s;
        }
        
        .text-4 {
            bottom: 20%;
            right: 18%;
            animation-delay: 1.5s;
        }
        
        /* Aura de networking */
        .networking-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            animation: auraRotate 30s linear infinite;
        }
        
        @keyframes auraRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .networking-aura::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Ambiente -->
        <div class="ambient-glow"></div>
        
        <!-- Aura de networking -->
        <div class="networking-aura"></div>
        
        <!-- Círculos de energia -->
        <div class="energy-circle circle-1"></div>
        <div class="energy-circle circle-2"></div>
        <div class="energy-circle circle-3"></div>
        
        <!-- Figuras -->
        <div class="figure figure-1">
            <div class="figure-body">
                <div class="figure-head"></div>
            </div>
        </div>
        
        <div class="figure figure-2">
            <div class="figure-body">
                <div class="figure-head"></div>
            </div>
        </div>
        
        <div class="figure figure-3">
            <div class="figure-body">
                <div class="figure-head"></div>
            </div>
        </div>
        
        <div class="figure figure-4">
            <div class="figure-body">
                <div class="figure-head"></div>
            </div>
        </div>
        
        <div class="figure figure-5">
            <div class="figure-body">
                <div class="figure-head"></div>
            </div>
        </div>
        
        <!-- Linhas de conexão -->
        <div class="connection-line line-1"></div>
        <div class="connection-line line-2"></div>
        <div class="connection-line line-3"></div>
        <div class="connection-line line-4"></div>
        <div class="connection-line line-5"></div>
        <div class="connection-line line-6"></div>
        
        <!-- Pontos de conexão -->
        <div class="connection-point point-1"></div>
        <div class="connection-point point-2"></div>
        <div class="connection-point point-3"></div>
        <div class="connection-point point-4"></div>
        <div class="connection-point point-5"></div>
        
        <!-- Partículas de interação -->
        <div class="interaction-particle particle-1"></div>
        <div class="interaction-particle particle-2"></div>
        <div class="interaction-particle particle-3"></div>
        <div class="interaction-particle particle-4"></div>
        
        <!-- Textos flutuantes -->
        <div class="floating-text text-1">Conexão</div>
        <div class="floating-text text-2">Diálogo</div>
        <div class="floating-text text-3">Sinergia</div>
        <div class="floating-text text-4">Cultura</div>
    </div>
</body>
</html>

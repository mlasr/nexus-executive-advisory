<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conceito 5 - Serenidade Zen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #0a0a0a 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zen-space {
            position: relative;
            width: 900px;
            height: 900px;
        }
        
        /* Círculo zen de fundo */
        .enso {
            position: absolute;
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            border-top-color: transparent;
            border-right-color: rgba(212, 175, 55, 0.3);
            animation: ensoRotate 20s linear infinite;
        }
        
        @keyframes ensoRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Círculos concêntricos */
        .circle-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            animation: ringPulse 6s ease-in-out infinite;
        }
        
        @keyframes ringPulse {
            0%, 100% { 
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(1);
            }
            50% { 
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }
        
        .ring-1 {
            width: 500px;
            height: 500px;
            animation-delay: 0s;
        }
        
        .ring-2 {
            width: 400px;
            height: 400px;
            animation-delay: 1s;
        }
        
        .ring-3 {
            width: 300px;
            height: 300px;
            animation-delay: 2s;
        }
        
        /* Figura em origami */
        .origami-figure {
            position: absolute;
            width: 300px;
            height: 650px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Cabeça origami */
        .origami-head {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 120px solid #d4af37;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 20px 40px rgba(212, 175, 55, 0.5));
            animation: origamiFloat 4s ease-in-out infinite;
        }
        
        @keyframes origamiFloat {
            0%, 100% { 
                transform: translateX(-50%) translateY(0);
            }
            50% { 
                transform: translateX(-50%) translateY(-10px);
            }
        }
        
        /* Detalhe facial origami */
        .origami-head::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-top: 60px solid rgba(140, 120, 83, 0.5);
            bottom: -120px;
            left: -50px;
        }
        
        /* Ombros origami */
        .origami-shoulders {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-top: 80px solid #c4a137;
            border-left: 130px solid transparent;
            border-right: 130px solid transparent;
            filter: drop-shadow(0 15px 30px rgba(196, 161, 55, 0.4));
            animation: shoulderFold 5s ease-in-out infinite;
        }
        
        @keyframes shoulderFold {
            0%, 100% { 
                border-top-width: 80px;
            }
            50% { 
                border-top-width: 85px;
            }
        }
        
        /* Torso origami */
        .origami-torso {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 320px;
            background: linear-gradient(135deg, 
                        #d4af37 0%,
                        #c4a137 30%,
                        #b8941f 70%,
                        #8c7853 100%);
            clip-path: polygon(
                20% 0%, 80% 0%,
                90% 30%, 90% 70%,
                80% 100%, 20% 100%,
                10% 70%, 10% 30%
            );
            filter: drop-shadow(0 30px 60px rgba(212, 175, 55, 0.5));
            animation: torsoSway 6s ease-in-out infinite;
        }
        
        @keyframes torsoSway {
            0%, 100% { 
                clip-path: polygon(
                    20% 0%, 80% 0%,
                    90% 30%, 90% 70%,
                    80% 100%, 20% 100%,
                    10% 70%, 10% 30%
                );
            }
            50% { 
                clip-path: polygon(
                    25% 0%, 75% 0%,
                    88% 30%, 88% 70%,
                    75% 100%, 25% 100%,
                    12% 70%, 12% 30%
                );
            }
        }
        
        /* Vincos de origami */
        .fold-line {
            position: absolute;
            width: 1px;
            background: linear-gradient(180deg, 
                        transparent,
                        rgba(0, 0, 0, 0.2),
                        transparent);
            animation: foldShimmer 3s ease-in-out infinite;
        }
        
        @keyframes foldShimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        .fold-1 {
            height: 150px;
            top: 50px;
            left: 40%;
            transform: rotate(-15deg);
            animation-delay: 0s;
        }
        
        .fold-2 {
            height: 200px;
            top: 200px;
            left: 50%;
            animation-delay: 0.5s;
        }
        
        .fold-3 {
            height: 150px;
            top: 50px;
            right: 40%;
            transform: rotate(15deg);
            animation-delay: 1s;
        }
        
        /* Bambus decorativos */
        .bamboo {
            position: absolute;
            width: 4px;
            background: linear-gradient(180deg, 
                        rgba(47, 93, 80, 0.3),
                        rgba(47, 93, 80, 0.6),
                        rgba(47, 93, 80, 0.3));
            border-radius: 2px;
            animation: bambooGrow 8s ease-in-out infinite;
        }
        
        @keyframes bambooGrow {
            0%, 100% { 
                transform: scaleY(1);
                opacity: 0.5;
            }
            50% { 
                transform: scaleY(1.05);
                opacity: 0.7;
            }
        }
        
        .bamboo-1 {
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .bamboo-2 {
            height: 350px;
            top: 15%;
            left: 15%;
            animation-delay: 1s;
        }
        
        .bamboo-3 {
            height: 280px;
            top: 12%;
            right: 12%;
            animation-delay: 0.5s;
        }
        
        .bamboo-4 {
            height: 320px;
            top: 18%;
            right: 18%;
            animation-delay: 1.5s;
        }
        
        /* Nós do bambu */
        .bamboo::before,
        .bamboo::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 2px;
            background: rgba(47, 93, 80, 0.8);
            left: -2px;
        }
        
        .bamboo::before {
            top: 30%;
        }
        
        .bamboo::after {
            top: 60%;
        }
        
        /* Pétalas zen */
        .petal {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(ellipse at 30% 30%, 
                        rgba(212, 175, 55, 0.6),
                        rgba(212, 175, 55, 0.3));
            border-radius: 50% 0;
            animation: petalFall 12s ease-in-out infinite;
            opacity: 0;
        }
        
        @keyframes petalFall {
            0% { 
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { 
                transform: translateY(400px) rotate(180deg);
                opacity: 0;
            }
        }
        
        .petal:nth-child(1) {
            top: -30px;
            left: 20%;
            animation-delay: 0s;
        }
        
        .petal:nth-child(2) {
            top: -30px;
            left: 40%;
            animation-delay: 2s;
        }
        
        .petal:nth-child(3) {
            top: -30px;
            left: 60%;
            animation-delay: 4s;
        }
        
        .petal:nth-child(4) {
            top: -30px;
            left: 80%;
            animation-delay: 6s;
        }
        
        .petal:nth-child(5) {
            top: -30px;
            left: 35%;
            animation-delay: 3s;
        }
        
        .petal:nth-child(6) {
            top: -30px;
            left: 55%;
            animation-delay: 5s;
        }
        
        /* Ondas de água zen */
        .water-ripple {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 3px;
            background: linear-gradient(90deg, 
                        transparent,
                        rgba(47, 93, 80, 0.3),
                        transparent);
            animation: rippleFlow 4s ease-in-out infinite;
        }
        
        @keyframes rippleFlow {
            0%, 100% { 
                transform: translateX(-50%) scaleX(1);
                opacity: 0.4;
            }
            50% { 
                transform: translateX(-50%) scaleX(1.1);
                opacity: 0.7;
            }
        }
        
        .ripple-1 {
            animation-delay: 0s;
        }
        
        .ripple-2 {
            bottom: 12%;
            animation-delay: 0.5s;
        }
        
        .ripple-3 {
            bottom: 14%;
            animation-delay: 1s;
        }
        
        /* Lua zen */
        .zen-moon {
            position: absolute;
            width: 150px;
            height: 150px;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle at 40% 40%, 
                        rgba(212, 175, 55, 0.3),
                        rgba(212, 175, 55, 0.1));
            border-radius: 50%;
            filter: blur(2px);
            animation: moonGlow 8s ease-in-out infinite;
        }
        
        @keyframes moonGlow {
            0%, 100% { 
                opacity: 0.5;
                transform: translateX(-50%) scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: translateX(-50%) scale(1.05);
            }
        }
        
        /* Partículas de luz zen */
        .zen-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
            animation: zenFloat 10s ease-in-out infinite;
        }
        
        @keyframes zenFloat {
            0%, 100% { 
                transform: translate(0, 0);
                opacity: 0.3;
            }
            50% { 
                transform: translate(30px, -100px);
                opacity: 1;
            }
        }
        
        .zen-particle:nth-child(1) {
            bottom: 20%;
            left: 25%;
            animation-delay: 0s;
        }
        
        .zen-particle:nth-child(2) {
            bottom: 25%;
            left: 45%;
            animation-delay: 2s;
        }
        
        .zen-particle:nth-child(3) {
            bottom: 22%;
            right: 30%;
            animation-delay: 4s;
        }
        
        .zen-particle:nth-child(4) {
            bottom: 28%;
            right: 35%;
            animation-delay: 1s;
        }
        
        .zen-particle:nth-child(5) {
            bottom: 24%;
            left: 50%;
            animation-delay: 3s;
        }
    </style>
</head>
<body>
    <div class="zen-space">
        <!-- Lua zen -->
        <div class="zen-moon"></div>
        
        <!-- Círculo enso -->
        <div class="enso"></div>
        
        <!-- Círculos concêntricos -->
        <div class="circle-ring ring-1"></div>
        <div class="circle-ring ring-2"></div>
        <div class="circle-ring ring-3"></div>
        
        <!-- Bambus -->
        <div class="bamboo bamboo-1"></div>
        <div class="bamboo bamboo-2"></div>
        <div class="bamboo bamboo-3"></div>
        <div class="bamboo bamboo-4"></div>
        
        <!-- Pétalas caindo -->
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        
        <!-- Ondas de água -->
        <div class="water-ripple ripple-1"></div>
        <div class="water-ripple ripple-2"></div>
        <div class="water-ripple ripple-3"></div>
        
        <!-- Partículas zen -->
        <div class="zen-particle"></div>
        <div class="zen-particle"></div>
        <div class="zen-particle"></div>
        <div class="zen-particle"></div>
        <div class="zen-particle"></div>
        
        <!-- Figura origami -->
        <div class="origami-figure">
            <div class="origami-head"></div>
            <div class="origami-shoulders"></div>
            <div class="origami-torso">
                <div class="fold-line fold-1"></div>
                <div class="fold-line fold-2"></div>
                <div class="fold-line fold-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
